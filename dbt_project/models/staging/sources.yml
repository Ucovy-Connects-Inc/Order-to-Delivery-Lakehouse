version: 2

sources:
  - name: bronze
    schema: bronze
    description: "Raw Olist Brazilian E-Commerce data ingested as-is by dlt."
    tables:
      - name: olist_orders_dataset
        description: "Raw orders table containing timestamps and delivery statuses."
      - name: olist_order_items_dataset
        description: "Raw items in each order with price and freight."
      - name: olist_customers_dataset
        description: "Raw customer records and geolocation prefixes."
      - name: olist_sellers_dataset
        description: "Raw seller records and location prefixes."
      - name: olist_products_dataset
        description: "Raw product dimensions and Portuguese categories."
      - name: olist_order_payments_dataset
        description: "Raw payment details and sequential installments."
      - name: product_category_name_translation
        description: "Raw category translation lookup."

