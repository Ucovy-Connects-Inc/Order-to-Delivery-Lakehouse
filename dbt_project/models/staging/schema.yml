version: 2

models:
  - name: stg_orders
    description: "Cleaned orders staging model with parsed Brazil local timestamps."
    columns:
      - name: order_id
        description: "Primary key for orders."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key referencing customers."
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_status
        description: "Standardized order status."
        tests:
          - not_null
          - accepted_values:
              values:
                - delivered
                - shipped
                - canceled
                - unavailable
                - invoiced
                - processing
                - created
                - approved
      - name: is_canceled
        description: "Flag indicating whether the order was canceled."
        tests:
          - not_null
      - name: order_purchase_timestamp
        description: "Timestamp when the order was purchased."
        tests:
          - not_null

  - name: stg_order_items
    description: "Cleaned order items staging model with line item pricing and freight."
    columns:
      - name: order_id
        description: "Foreign key referencing orders."
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: order_item_id
        description: "Sequential line item number within order."
        tests:
          - not_null
      - name: product_id
        description: "Foreign key referencing products."
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
      - name: seller_id
        description: "Foreign key referencing sellers."
        tests:
          - not_null
          - relationships:
              to: ref('stg_sellers')
              field: seller_id
      - name: price
        description: "Item price."
        tests:
          - not_null

  - name: stg_customers
    description: "Cleaned customers staging model."
    columns:
      - name: customer_id
        description: "Primary key for customer orders."
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: "Unique identifier across repeated orders."
        tests:
          - not_null

  - name: stg_sellers
    description: "Cleaned sellers staging model."
    columns:
      - name: seller_id
        description: "Primary key for sellers."
        tests:
          - unique
          - not_null

  - name: stg_products
    description: "Cleaned products staging model with translated categories."
    columns:
      - name: product_id
        description: "Primary key for products."
        tests:
          - unique
          - not_null

  - name: stg_payments
    description: "Cleaned payments staging model."
    columns:
      - name: order_id
        description: "Foreign key referencing orders."
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: payment_sequential
        description: "Sequential payment number for order."
        tests:
          - not_null
      - name: payment_type
        description: "Method of payment."
        tests:
          - not_null

